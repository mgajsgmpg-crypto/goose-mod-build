name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip project
        run: |
          unzip Goose-Goose-Duck-Android-Mod-2.1.zip
          cd Goose-Goose-Duck-Android-Mod-2.1
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x Goose-Goose-Duck-Android-Mod-2.1/gradlew

      - name: Build with Gradle
        run: |
          cd Goose-Goose-Duck-Android-Mod-2.1
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Goose-Goose-Duck-Android-Mod-2.1/app/build/outputs/apk/debug/*.apk
