name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract and Find Project
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Found ZIP file. Unzipping..."
            unzip -q *.zip
          fi
          PROJECT_DIR=$(find . -name "gradlew" -type f | head -n 1 | xargs dirname)
          echo "Project directory is: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Gradle Wrapper 9.1.0
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle wrapper --gradle-version 9.1.0

      - name: Grant execute permission for gradlew
        run: chmod +x ${{ env.PROJECT_DIR }}/gradlew

      - name: Build with Gradle
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
